[project]
name = "autonomous-support-agent"
version = "0.1.0"
description = "Autonomous Customer Support Agent System using LangGraph State Machine, Qdrant Vector DB, and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-community>=0.3.14",
    "qdrant-client>=1.12.0",
    "numpy>=1.26.0",
    "streamlit>=1.30.0",
    "pydantic-settings>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0"
]
