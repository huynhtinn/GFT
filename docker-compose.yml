version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant_vector_db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gft_support_app
    restart: always
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      - ./user.db:/app/user.db
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data: