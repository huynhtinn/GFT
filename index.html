    // --- AI PIPELINE LOGIC ---
    function processAIPipeline(inputTicket, kbDocs) {
      const logs = [];
      const now = new Date().toISOString();
      let ticket = { ...inputTicket, status: 'AI_PROCESSING' };

      // Step 1: Spam check
      logs.push({ stepName: '1. Spam & Duplicate Inspector', status: 'running', detail: 'Đang kiểm tra rác & ticket trùng...' });
      const spamKeywords = ['crypto', 'bitcoin', 'loans', 'click here', 'scam', 'trading robot'];
      const isSpam = spamKeywords.some(kw => (ticket.content + ' ' + ticket.subject).toLowerCase().includes(kw));

      if (isSpam) {
        ticket.status = 'SPAM_CLOSED';
        ticket.isSpam = true;
        ticket.category = 'spam';
        ticket.priority = 'P3_LOW';
        ticket.confidenceScore = 99;
        logs.push({ stepName: '1. Spam & Duplicate Inspector', status: 'warning', detail: 'Phát hiện SPAM! Tự động đóng ticket.' });
        return { updatedTicket: ticket, logs };
      }
      logs.push({ stepName: '1. Spam & Duplicate Inspector', status: 'success', detail: 'Ticket hợp lệ (Not Spam).' });

      // Step 2: Intent & Priority Classifier
      logs.push({ stepName: '2. Intent & Priority Classifier', status: 'running', detail: 'Gemini Agent đang phân tích Intent & Priority...' });
      const contentLower = (ticket.subject + ' ' + ticket.content).toLowerCase();
      let category = 'faq';
      let priority = 'P3_LOW';

      if (contentLower.includes('khẩn cấp') || contentLower.includes('sập') || contentLower.includes('p0')) {
        category = 'urgent'; priority = 'P0_CRITICAL';
      } else if (contentLower.includes('bức xúc') || contentLower.includes('hoàn tiền') || contentLower.includes('trừ tiền')) {
        category = 'billing'; priority = 'P1_HIGH';
      } else if (contentLower.includes('lỗi') || contentLower.includes('403') || contentLower.includes('500') || contentLower.includes('api')) {
        if (!contentLower.includes('ip') && !contentLower.includes('key')) {
          category = 'incomplete'; priority = 'P2_MEDIUM';
        } else {
          category = 'technical'; priority = 'P2_MEDIUM';
        }
      }

      ticket.category = category;
      ticket.priority = priority;
      logs.push({ stepName: '2. Intent & Priority Classifier', status: 'success', detail: `Đã phân loại: [${category.toUpperCase()}] | Priority [${priority}]` });

      // Step 3: Slot filling
      logs.push({ stepName: '3. Slot Completeness Inspector', status: 'running', detail: 'Kiểm tra thông tin bắt buộc...' });
      if (category === 'incomplete') {
        ticket.status = 'CLARIFICATION_SENT';
        ticket.missingSlots = ['API Key 4 số cuối', 'IP Client'];
        ticket.clarificationQuestion = `Kính chào quý khách,\n\nĐể hỗ trợ xử lý lỗi 403 Forbidden, quý khách vui lòng cung cấp giúp em: (1) 4 ký tự cuối API Key, và (2) IP Client kết nối. Xin cảm ơn!`;
        ticket.confidenceScore = 88;
        logs.push({ stepName: '3. Slot Completeness Inspector', status: 'warning', detail: 'THIẾU THÔNG TIN BẮT BUỘC. Tự động gửi câu hỏi làm rõ.' });
        return { updatedTicket: ticket, logs };
      }
      logs.push({ stepName: '3. Slot Completeness Inspector', status: 'success', detail: 'Thông tin đầy đủ.' });

      // Step 4: RAG Vector Match
      logs.push({ stepName: '4. Vector RAG & Grounding Engine', status: 'running', detail: 'Vector Search trên Kho tri thức KB...' });
      const citations = [];
      let bestScore = 0;
      for (const doc of kbDocs) {
        const match = doc.tags.some(t => contentLower.includes(t));
        if (match) {
          const score = 0.88 + Math.random() * 0.1;
          if (score > bestScore) bestScore = score;
          citations.push({
            docId: doc.id,
            docTitle: doc.title,
            section: 'Trích đoạn tài liệu chính thức',
            snippet: doc.content.slice(0, 160) + '...',
            relevanceScore: parseFloat(score.toFixed(2))
          });
        }
      }
      ticket.citations = citations;
      ticket.confidenceScore = citations.length > 0 ? Math.round(bestScore * 100) : 55;
      logs.push({ stepName: '4. Vector RAG & Grounding Engine', status: citations.length > 0 ? 'success' : 'warning', detail: `Tìm thấy ${citations.length} tài liệu match. Grounding Score: ${ticket.confidenceScore}%` });

      // Step 5: Decision Routing
      logs.push({ stepName: '5. Guardrails & Decision Matrix Router', status: 'running', detail: 'Kiểm tra ngưỡng an toàn RAG & Risk Level...' });
      const isHighRisk = priority === 'P0_CRITICAL' || category === 'complaint' || category === 'billing' || category === 'urgent';
      const isLowConfidence = (ticket.confidenceScore || 0) < 80;

      if (isHighRisk || isLowConfidence) {
        ticket.status = 'ESCALATED_HUMAN';
        ticket.contextPackage = {
          summary: `Yêu cầu thuộc nhóm [${category.toUpperCase()}]. Tiêu đề: ${ticket.subject}`,
          sentiment: priority === 'P0_CRITICAL' ? 'Khẩn cấp' : priority === 'P1_HIGH' ? 'Bức xúc' : 'Bình thường',
          triedSteps: [
            `Phân loại Intent: ${category} (${priority})`,
            `RAG Match: ${citations.length} tài liệu`,
            `Guardrails: Yêu cầu rủi ro cao -> Chuyển Human Agent`
          ],
          recommendedAction: priority === 'P0_CRITICAL' ? 'Cảnh báo DevOps ca trực khẩn cấp.' : 'Đối soát dữ liệu và hỗ trợ trực tiếp.',
          autoDraftResponse: `Kính chào ${ticket.customerName},\n\nHệ thống đã tiếp nhận yêu cầu. Nhân viên hỗ trợ đang kiểm tra và sẽ phản hồi quý khách sớm nhất.`,
          confidenceScore: ticket.confidenceScore || 75,
          escalationReason: isHighRisk ? `Giao dịch ${category.toUpperCase()} rủi ro cao cần con người phê duyệt.` : 'Độ tin cậy RAG < 80%.'
        };
        logs.push({ stepName: '5. Guardrails & Decision Matrix Router', status: 'warning', detail: `KÍCH HOẠT HUMAN HANDOFF! Lý do: ${ticket.contextPackage.escalationReason}` });
      } else {
        ticket.status = 'RESOLVED_AUTO';
        ticket.aiAnswer = `Kính chào ${ticket.customerName},\n\nCảm ơn quý khách đã liên hệ. Dựa trên thông tin quy định chính thức:\n\n${citations[0]?.snippet || 'Xin phản hồi thông tin đến quý khách.'}\n\n[Nguồn: ${citations[0]?.docTitle || 'Kho Tri Thức Nội Bộ'}]`;
        logs.push({ stepName: '5. Guardrails & Decision Matrix Router', status: 'success', detail: 'TỰ ĐỘNG PHẢN HỒI AN TOÀN (Auto-Resolved).' });
      }

      return { updatedTicket: ticket, logs };
    }

      const [selectedEscalatedId, setSelectedEscalatedId] = useState('');

      const [isEditingDraft, setIsEditingDraft] = useState(false);

      // Simulator Form state
      const [simChannel, setSimChannel] = useState('website');
      const [simName, setSimName] = useState('Đỗ Thành Nam');
      const [simEmail, setSimEmail] = useState('nam.do@enterprise.com');
      const [simSubject, setSimSubject] = useState('');
      const [simContent, setSimContent] = useState('');

      // KB Form state
      const [kbTitle, setKbTitle] = useState('');
      const [kbCategory, setKbCategory] = useState('Chính sách');
      const [kbContent, setKbContent] = useState('');
      const [kbTags, setKbTags] = useState('');

      const escalatedTickets = tickets.filter(t => t.status === 'ESCALATED_HUMAN');

      useEffect(() => {
        if (escalatedTickets.length > 0 && !selectedEscalatedId) {
          setSelectedEscalatedId(escalatedTickets[0].id);
        }
      }, [tickets]);

      const currentEscalatedTicket = tickets.find(t => t.id === selectedEscalatedId) || escalatedTickets[0];

      useEffect(() => {
        if (currentEscalatedTicket && currentEscalatedTicket.contextPackage) {
          setDraftText(currentEscalatedTicket.contextPackage.autoDraftResponse);
        }
      }, [selectedEscalatedId]);

      const runPipelineForTicket = (ticketToProcess) => {
        setSelectedTicket(ticketToProcess);
        setActiveTab('pipeline');
        setIsRunningPipeline(true);
        setLogs([]);

        const { updatedTicket, logs: engineLogs } = processAIPipeline(ticketToProcess, kbDocs);

                  <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">

                  </span>
                  <h2 className="text-xl font-bold text-white mt-2">Kho Tri Thức Doanh Nghiệp (RAG KB)</h2>
                  <p className="text-sm text-slate-400 mt-1">Quản lý tài liệu tri thức chính thức được nhúng Vector Embedding cho AI tra cứu.</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                  {/* Left List */}
                  <div className="lg:col-span-5 space-y-3">
                    <h3 className="font-semibold text-white text-sm">Danh mục Tài liệu ({kbDocs.length})</h3>
                    <div className="space-y-3 max-h-[600px] overflow-y-auto pr-1">
                      {kbDocs.map(doc => (
                        <div key={doc.id} className="glass-card p-4 rounded-xl border border-slate-800 space-y-1">
                          <div className="flex justify-between text-xs text-emerald-400 font-mono font-bold">
                            <span>{doc.id}</span>
                            <span>{doc.version}</span>
                          </div>
                          <h4 className="font-semibold text-sm text-white">{doc.title}</h4>
                          <p className="text-xs text-slate-400 line-clamp-2">{doc.content}</p>
                          <div className="pt-2 flex justify-between text-[10px] text-slate-400">
                            <span className="px-2 py-0.5 bg-slate-800 rounded">{doc.category}</span>
                            <span>{doc.chunkCount} Chunks</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Right Add Form */}
                  <div className="lg:col-span-7 space-y-6">
                    <div className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                      <h3 className="font-semibold text-white text-base">Bổ sung Tài liệu Tri thức Mới</h3>
                      <form onSubmit={handleAddKbSubmit} className="space-y-4">
                        <div>
                          <label className="text-xs text-slate-400 mb-1 block">Tên tài liệu</label>
                          <input
                            type="text"
                            placeholder="Ví dụ: Quy trình hỗ trợ Webhook Zalo..."
                            value={kbTitle}
                            onChange={(e) => setKbTitle(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                            required
                          />
                        </div>

                        <div>
                          <label className="text-xs text-slate-400 mb-1 block">Từ khóa (Tags - Phân cách phẩy)</label>
                          <input
                            type="text"
                            placeholder="webhook, zalo, api"
                            value={kbTags}
                            onChange={(e) => setKbTags(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                          />
                        </div>

                        <div>
                          <label className="text-xs text-slate-400 mb-1 block">Nội dung chi tiết tài liệu</label>
                          <textarea
                            rows={5}
                            placeholder="Nhập quy trình chính thức..."
                            value={kbContent}
                            onChange={(e) => setKbContent(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white resize-none"
                            required
                          />
                        </div>

                        <button
                          type="submit"
                          className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-xs text-white shadow-lg shadow-emerald-600/30"
                        >
                          Vectorize & Index Vào Kho Tri Thức
                        </button>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 5: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                <div className="glass-panel p-6 rounded-2xl border border-slate-800 bg-gradient-to-r from-cyan-950/20 via-slate-900 to-slate-900">
                  <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                    Tầng 5: Supervisor Observability & Active Learning
                  </span>
                  <h2 className="text-xl font-bold text-white mt-2">Báo Cáo Quan Sát Vận Hành & KPI</h2>
                  <p className="text-sm text-slate-400 mt-1">Đánh giá tỷ lệ giảm tải (Deflection Rate), thời gian xử lý SLA và tự động phát hiện khoảng trống tri thức.</p>
                </div>

                {/* Metrics Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                  <div className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-1">
                    <div className="text-xs text-slate-400">Tỷ lệ AI Tự Giải Quyết</div>
                    <div className="text-3xl font-bold text-emerald-400 font-mono">68.5%</div>
                    <div className="text-[11px] text-slate-400">Tự động xử lý an toàn</div>
                  </div>
                  <div className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-1">
                    <div className="text-xs text-slate-400">Tỷ lệ Chuyển Con Người</div>
                    <div className="text-3xl font-bold text-amber-400 font-mono">24.0%</div>
                    <div className="text-[11px] text-slate-400">Rủi ro cao / Thiếu tin cậy</div>
                  </div>
                  <div className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-1">
                    <div className="text-xs text-slate-400">Thời gian Phản hồi SLA</div>
                    <div className="text-3xl font-bold text-white font-mono">14s</div>
                    <div className="text-[11px] text-cyan-400">Nhanh gấp 10x thủ công</div>
                  </div>
                  <div className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-1">
                    <div className="text-xs text-slate-400">Độ Tin Cậy RAG</div>
                    <div className="text-3xl font-bold text-indigo-400 font-mono">94.2%</div>
                    <div className="text-[11px] text-slate-400">Minh bạch kèm Dẫn nguồn</div>
                  </div>
                </div>

                {/* Active Learning: KB Gap Detection */}
                <div className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                  <h3 className="font-semibold text-white text-base">Phát Hiện Khoảng Trống Tri Thức (KB Gap Analytics)</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                      <div className="flex justify-between text-xs font-semibold text-white">
                        <span>Chưa có hướng dẫn Webhook Zalo ZNS v3</span>
                        <span className="text-amber-400 font-bold">14 ticket bị chuyển giao</span>
                      </div>
                      <p className="text-xs text-slate-400">Gợi ý: Tạo thêm 01 tài liệu kỹ thuật hướng dẫn cài đặt Webhook Zalo API v3 vào KB.</p>
                    </div>
                    <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                      <div className="flex justify-between text-xs font-semibold text-white">
                        <span>Quy trình xuất hóa đơn VAT điện tử FDI</span>
                        <span className="text-amber-400 font-bold">9 ticket bị chuyển giao</span>
                      </div>
                      <p className="text-xs text-slate-400">Gợi ý: Cập nhật quy định VAT nhà thầu nước ngoài vào KB-POL-001.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="glass-panel border-t border-slate-800 py-6 text-center text-xs text-slate-500 mt-auto">
            AUTOMATION/AGENT — Tổng đài Hỗ trợ Tự vận hành | Built with React, RAG Engine & Multi-Agent Architecture
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
